include:
  - project: 'hive/common-ci-configuration'
    ref: 394fc42bc7bf7deefa89792959de34f16c9e681b
    file:
      - '/templates/python_projects.gitlab-ci.yml'

stages:
  - static_code_analysis
  - benchmark

variables:
  CI_DEBUG_SERVICES: "true"
  BENCHMARK_ADDRESS: ""
  BENCHMARK_PORT: ""

verify_poetry_lock_stability:
  stage: static_code_analysis
  extends: .verify_poetry_lock_stability_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}"
  tags:
    - public-runner-docker

Trigger any benchmark:
  stage: benchmark
  image: alpine:3.7
  rules:
    - when: manual
  services:
    - name: registry.gitlab.syncad.com/hive/tests_api/benchmark_aio:latest
      alias: benchmark
      variables:
        # const:
        eROOT_DIR: "/builds/hive/tests_api"
        # required:
        eADDRESS: $BENCHMARK_ADDRESS
        ePORT: $BENCHMARK_PORT
        # optional:
        eJOBS: 1
        eLOOPS: 1
        # eAPI: account_history_api
        # eCSV: perf_60M_heavy.csv
        # eJOBS: 10
        # eLOOPS: 500
        # eCALL_STYLE: old-style
        # ePOSTGRES_URL: postgresql:///haf_block_log
        # ePOSTGRES_SCHEMA: hive
        # eSERVE_PORT: ""
  script:
    - ls -la /
    - find /builds -type d -maxdepth 4
